<!doctype html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <!-- WICHTIG: robots-noindex erst entfernen, wenn alle Platzhalter geprüft wurden. -->
    <title>Impressum | Moritz Bäß</title>
    <style>
        :root {
            --beige: #f5f0e8;
            --red: #a5222b;
            --ink: #24201e;
            --soft: #e8dfd3;
            --font: Arial, Helvetica, sans-serif;
        }
        * { box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            margin: 0;
            background: var(--beige);
            color: var(--ink);
            font-family: var(--font);
            line-height: 1.7;
        }
        a { color: inherit; }
        a:hover { color: var(--red); }
        .site-header {
            position: sticky;
            top: 0;
            z-index: 10;
            background: rgba(245,240,232,.96);
            border-bottom: 1px solid var(--soft);
            backdrop-filter: blur(10px);
        }
        .bar {
            max-width: 1100px;
            min-height: 74px;
            padding: 12px 24px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }
        .brand {
            text-decoration: none;
            font-weight: 750;
            font-size: 1.15rem;
            letter-spacing: .02em;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .mark { color: var(--red); font-size: 2rem; line-height: 1; }
        .back { font-size: .92rem; text-decoration: none; border-bottom: 1px solid var(--red); }
        main { max-width: 900px; margin: 0 auto; padding: 70px 24px 95px; }
        .eyebrow {
            color: var(--red);
            font-size: .85rem;
            font-weight: 700;
            letter-spacing: .16em;
            text-transform: uppercase;
        }
        h1 { font-size: clamp(2.4rem, 6vw, 4.2rem); line-height: 1.1; margin: 10px 0 20px; }
        h2 { font-size: clamp(1.25rem, 3vw, 1.55rem); line-height: 1.25; margin: 0 0 14px; }
        p { margin: 0 0 14px; }
        .intro { max-width: 67ch; color: #514a44; margin-bottom: 52px; }
        .legal-section { padding: 34px 0; border-top: 1px solid #a5222b55; }
        .legal-section p, .legal-section li { max-width: 80ch; }
        ul { margin: 0 0 14px; padding-left: 24px; }
        .placeholder { color: #96232a; font-weight: 700; background: #f1e0dc; padding: 0 4px; }
        .editor-note {
            border-left: 3px solid var(--red);
            padding: 16px 20px;
            margin: 0 0 36px;
            background: #efe6dd;
        }
        .editor-note strong { color: var(--red); }
        footer {
            border-top: 1px solid var(--soft);
            padding: 26px 24px;
            text-align: center;
            font-size: .88rem;
            color: #6c625a;
        }
        footer a { margin: 0 10px; }
        @media (max-width: 700px) {
            .bar { min-height: 66px; padding: 10px 18px; }
            .brand { font-size: .98rem; }
            main { padding: 46px 18px 70px; }
            .legal-section { padding: 28px 0; }
        }
</style>
</head>
<body>
    <header class="site-header">
        <div class="bar">
            <a class="brand" href="index.html" aria-label="Zur Startseite">
                <span class="mark" aria-hidden="true">♦</span>
                <span>Moritz Bäß | Magier</span>
            </a>
            <a class="back" href="index.html">← Zur Startseite</a>
        </div>
    </header>
    <main>
        <div class="eyebrow">Rechtliche Angaben</div>
        <h1>Impressum</h1>
        <p class="intro">Angaben zum Anbieter dieser Website.</p>
        

        <section class="legal-section">
            <h2>Angaben gemäß § 5 DDG</h2>
            <p>
                Moritz Bäß<br>
                Zauberkünstler / Magier<br>
                Dedestraße 10<br>
                26135 Oldenburg<br>
                Deutschland
            </p>
        </section>

        <section class="legal-section">
            <h2>Kontakt</h2>
            <p>
                <!--Telefon: <a href="tel:+xxxxxxxxxx">+49 xxx xxxxxxx</a><br> -->
                E-Mail: <a href="mailto:moritz.baess@gmail.com">moritz.baess@gmail.com</a>
            </p>
        </section>

        <!--

        -->

    </main>
    <footer>
        <span>© Moritz Bäß</span>
        <a href="index.html">Startseite</a>
        <a href="impressum.html">Impressum</a>
        <a href="datenschutz.html">Datenschutz</a>
    </footer>
</body>
</html>
